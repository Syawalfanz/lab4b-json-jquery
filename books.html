<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q2: Fetch and Display JSON</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
    .label { font-weight: bold; }
    .error { background: #fde2e2; color: #a30000; border: 1px solid #a30000; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Book Information (from books.json)</h1>
  <div id="output">Loading...</div>

  <script>
    const output = document.getElementById("output");

    // Helper: create a <p> with a bold label and plain value (safe, uses textContent)
    function addLine(parent, label, value) {
      const p = document.createElement("p");
      const strong = document.createElement("span");
      strong.className = "label";
      strong.textContent = label + ": ";
      p.appendChild(strong);
      p.appendChild(document.createTextNode(value));
      parent.appendChild(p);
    }

    async function loadBooks() {
      try {
        const response = await fetch("books.json");

        // fetch() only rejects on network failure, so check HTTP status manually
        if (!response.ok) {
          throw new Error("HTTP error " + response.status);
        }

        const data = await response.json(); // throws if JSON is invalid

        if (!data.books || data.books.length < 2) {
          throw new Error("Unexpected data structure");
        }

        const books = data.books;
        output.textContent = ""; // clear "Loading..."

        // (a) Title of the first book
        const cardA = document.createElement("div");
        cardA.className = "card";
        addLine(cardA, "(a) Title of the first book", books[0].title);
        output.appendChild(cardA);

        // (b) Author of the second book
        const cardB = document.createElement("div");
        cardB.className = "card";
        addLine(cardB, "(b) Author of the second book", books[1].author);
        output.appendChild(cardB);

        // (c) Genres of both books, grouped by title
        const cardC = document.createElement("div");
        cardC.className = "card";
        const heading = document.createElement("p");
        heading.className = "label";
        heading.textContent = "(c) Genres by book:";
        cardC.appendChild(heading);

        const ul = document.createElement("ul");
        books.forEach(book => {
          const li = document.createElement("li");
          li.textContent = book.title + " — " + book.genres.join(", ");
          ul.appendChild(li);
        });
        cardC.appendChild(ul);
        output.appendChild(cardC);

      } catch (error) {
        console.error(error);
        output.textContent = "";
        const errBox = document.createElement("div");
        errBox.className = "error";
        errBox.textContent = "Sorry, the book data could not be loaded. " +
          "Please make sure books.json exists and the page is opened through a local server. (" +
          error.message + ")";
        output.appendChild(errBox);
      }
    }

    loadBooks();
  </script>
</body>
</html>

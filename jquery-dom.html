<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 4b - Q3: Native JavaScript vs jQuery</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    div, button { margin-bottom: 12px; }
    .myStyle { background-color: coral; padding: 16px; }
  </style>
  <!-- jQuery 4.0.0 full build (not slim) -->
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
  <h1>jQuery DOM Manipulation</h1>

  <div id="myElement">Original Text</div>
  <div id="myDIV"><p>I am a myDIV.</p></div>
  <button id="myButton">Click me</button>

  <script>
    // Run after the DOM is ready
    $(function () {
      // (a) Native: document.getElementById("myElement").textContent = "Modified Text";
      $("#myElement").text("Modified Text");

      // (b) Native: document.querySelector("#myDIV").classList.add("myStyle");
      $("#myDIV").addClass("myStyle");

      // (c) Native: document.getElementById("myButton").addEventListener("click", () => alert("Button clicked!"));
      $("#myButton").on("click", function () {
        alert("Button clicked!");
      });
    });
  </script>
</body>
</html>
